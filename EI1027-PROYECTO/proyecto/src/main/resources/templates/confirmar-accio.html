<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Acció - Projecte OVI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<main class="portal-wrapper py-5">
    <div class="portal-card text-center shadow-sm" style="max-width: 500px; padding: 3rem 2.5rem; border-top: 5px solid #ef4444;">

        <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="#ef4444" class="bi bi-exclamation-triangle-fill" viewBox="0 0 16 16">
                <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
            </svg>
        </div>

        <h3 class="fw-bold mb-3 text-dark">Confirmació necessària</h3>
        <p class="text-muted fs-6 mb-5" th:text="${missatge}">Estàs segur de realitzar aquesta acció?</p>

        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
            <a th:href="${urlRetorn}" class="btn btn-outline-secondary px-4 py-2 fw-medium">
                Cancel·lar
            </a>
            <a th:href="${urlDesti}" class="btn btn-danger px-4 py-2 fw-bold">
                Sí, estic segur
            </a>
        </div>

    </div>
</main>

</body>
</html>
