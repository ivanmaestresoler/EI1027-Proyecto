<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Operació Completada - Projecte OVI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<main class="portal-wrapper py-5">
  <div class="portal-card text-center shadow-sm" style="max-width: 500px; padding: 3rem 2.5rem; border-top: 5px solid #10b981; margin: 0 auto; background: white; border-radius: 8px;">

    <div class="mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" fill="#10b981" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
      </svg>
    </div>

    <h3 class="fw-bold mb-3 text-dark">Actualitzat correctament</h3>

    <p class="text-muted fs-6 mb-5" th:text="${missatge}">Les dades s'han guardat amb èxit.</p>

    <div class="d-flex justify-content-center">
      <a th:href="${urlRetorn}" class="btn btn-success px-5 py-2 fw-bold" style="background-color: #10b981; border: none; border-radius: 6px;">
        Continuar
      </a>
    </div>

  </div>
</main>

</body>
</html>
